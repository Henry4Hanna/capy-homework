<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Henry & Hanna Homework Club</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf6ec;--card:#fffdf9;--tx:#5a4330;--mu:#9a8470;--bd:#f1e3d0;--pri:#e59a6b;--ok:#8fc0a4;--okbg:#eaf5ee;--henry:#f5c84b;--hanna:#f3a7b8;--soft:#fbeedd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2a211b;--card:#352a22;--tx:#f5e6d3;--mu:#b9a58f;--bd:#4a3b30;--okbg:#2c3f35;--soft:#3f3228}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2a211b;--card:#352a22;--tx:#f5e6d3;--mu:#b9a58f;--bd:#4a3b30;--okbg:#2c3f35;--soft:#3f3228}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 "Jua",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bubble{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:8px 12px;font-size:14px;flex:1}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--soft);border:2px solid var(--bd);border-radius:12px;padding:8px 10px;min-width:0}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:9px 16px;cursor:pointer}
.ghost{background:var(--soft);color:var(--tx);border:2px solid var(--bd)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border:2px solid var(--bd);background:var(--card);border-radius:16px;cursor:pointer;font-size:17px}
.tab.on{color:#5a4330}.tab.on[data-k="Henry"]{background:var(--henry);border-color:var(--henry)}.tab.on[data-k="Hanna"]{background:var(--hanna);border-color:var(--hanna)}
.bar{height:14px;background:var(--bd);border-radius:10px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc,var(--ok));border-radius:10px;transition:width .4s}
.mu{color:var(--mu);font-size:13px}
.task{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--bd);border-radius:16px;margin-bottom:8px;background:var(--card)}
.task.done{background:var(--okbg);border-color:var(--ok)}
.task .info{flex:1;min-width:0}.task b{font-weight:400;font-size:18px;display:block}
.fin{background:var(--pri);color:#fff;border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font-size:15px}
.done .fin{background:var(--ok)}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.ann{display:flex;gap:10px;padding:10px;border-radius:14px;background:var(--soft);margin-bottom:8px;align-items:flex-start}
.ann .ic{font-size:24px}.ann .tt{flex:1}.ann b{font-weight:400;font-size:17px}
.pill{font-size:12px;background:var(--pri);color:#fff;border-radius:10px;padding:1px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--bd);background:var(--soft);border-radius:20px;padding:2px 10px;font-size:13px;cursor:pointer}
.sub{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.sub span:first-child{width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .b{flex:1;height:14px;background:var(--bd);border-radius:8px;overflow:hidden}.sub .b i{display:block;height:100%;border-radius:8px}
.leg{display:flex;gap:12px;font-size:13px;margin-top:4px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.modal{position:fixed;inset:0;background:rgba(60,40,25,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}.modal .card{max-width:340px;width:100%;margin:0}
.err{color:#d8605a;font-size:13px;min-height:18px}.hide{display:none!important}
svg text{fill:var(--mu);font-family:inherit}
</style></head><body><div class="wrap">

<div class="top">
  <svg id="capy" width="84" height="70" viewBox="0 0 120 100"></svg>
  <div class="bubble" id="say">Let’s do this!</div>
  <button class="btn ghost" id="lock">🔒 Parent</button>
</div>

<div class="card row">
  <button class="btn ghost" id="prev">‹</button>
  <input type="date" id="date" style="flex:1">
  <button class="btn ghost" id="next">›</button>
  <button class="btn ghost" id="today">Today</button>
</div>
<div class="mu" id="st" style="text-align:right;margin:-6px 4px 8px"></div>

<div class="tabs" id="tabs"></div>
<div class="card" id="summary"></div>
<div id="list"></div>

<div class="card hide" id="addbox">
  <h2>➕ Add homework (parent)</h2>
  <div class="row">
    <input type="text" id="subj" list="subs" placeholder="Subject (Math, iReady…)" style="flex:2;min-width:140px">
    <input type="number" id="min" value="20" min="1" style="width:76px"> <span class="mu">min</span>
  </div>
  <datalist id="subs"><option>Math</option><option>iReady</option><option>Reading</option><option>Writing</option><option>Spelling</option><option>Vietnamese</option></datalist>
  <div class="row" style="margin-top:8px">
    <label><input type="checkbox" id="fH" checked> Henry</label>
    <label><input type="checkbox" id="fA" checked> Hanna</label>
    <button class="btn" id="add" style="margin-left:auto">Add</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="row" style="margin-top:10px">
    <button class="btn ghost" id="copy">Repeat yesterday’s list</button>
    <button class="btn ghost" id="chpin">Change PIN</button>
    <button class="btn ghost" id="sync">☁️ GitHub sync</button>
  </div>
</div>

<div class="card">
  <h2>📣 Announcements</h2>
  <div id="anns"></div>
  <div class="hide" id="annform">
    <div class="row" style="margin-top:8px">
      <select id="atype"><option value="🚌">Field Trip</option><option value="👨‍👩‍👧">Parent Meeting</option><option value="🏖️">Holiday</option><option value="🎉">Event</option><option value="📌">Other</option></select>
      <input type="text" id="atitle" placeholder="Title" style="flex:1;min-width:120px">
    </div>
    <div class="row" style="margin-top:8px"><input type="date" id="adate"><input type="time" id="atime"></div>
    <div class="row" style="margin-top:8px"><input type="text" id="anote" placeholder="Notes (optional)" style="flex:1"><button class="btn" id="aadd">Post</button></div>
  </div>
</div>

<div class="card">
  <h2>📊 Minutes finished – last 7 days</h2>
  <svg id="chart1" viewBox="0 0 320 150" width="100%"></svg>
  <div class="leg"><span><i class="dot" style="background:var(--henry)"></i>Henry</span><span><i class="dot" style="background:var(--hanna)"></i>Hanna</span></div>
</div>
<div class="card">
  <h2 id="ch2t">🍡 Subjects this week</h2>
  <div id="chart2"></div>
  <div class="mu" id="rate" style="margin-top:8px"></div>
</div>
</div>

<div class="modal" id="pinm"><div class="card">
  <h2 id="pint">Enter parent PIN</h2>
  <input type="password" id="pin" inputmode="numeric" maxlength="8" style="width:100%" placeholder="PIN">
  <div class="err" id="perr"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="pcancel">Cancel</button><button class="btn" id="pok">OK</button></div>
</div></div>

<div class="modal" id="syncm"><div class="card">
  <h2>☁️ GitHub sync (this device)</h2>
  <div class="mu" style="margin-bottom:8px">Data repo (private) and a fine-grained token with <b>Contents: Read and write</b> on that repo only. Saved only on this device.</div>
  <input type="text" id="grepo" placeholder="owner/repo (e.g. yourname/homework-data)" style="width:100%;margin-bottom:8px">
  <input type="password" id="gtok" placeholder="github_pat_…" style="width:100%">
  <div class="err" id="gerr"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="gdis">Disconnect</button><button class="btn ghost" id="gcancel">Close</button><button class="btn" id="gsave">Save & test</button></div>
</div></div>

<script>
const KIDS=["Henry","Hanna"],COL={Henry:"var(--henry)",Hanna:"var(--hanna)"};
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>({data:(s&&s.data)||{},anns:(s&&s.anns)||[],pin:(s&&s.pin)||null});
/* === OPTIONAL: put sync settings here so every device connects automatically === */
const GH_REPO="henry4hanna/homework-data";   // e.g. "yourname/homework-data"
const GH_TOKEN="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";  // fine-grained token: Contents Read and write, data repo only
let S=norm(ld("hwS",null)),cfg=ld("hwGH",null)||(GH_REPO&&GH_TOKEN?{repo:GH_REPO,token:GH_TOKEN}:null),sha=null,q=Promise.resolve();
let parent=false,cur="Henry",date=iso(new Date()),pinMode="unlock";
function iso(d){return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function shift(n,b){const d=new Date((b||date)+"T12:00");d.setDate(d.getDate()+n);return iso(d)}
const tasks=(d,k)=>(S.data[d]||{})[k]||[];
const cache=()=>sv("hwS",S);
async function H(s){if(!(window.crypto&&crypto.subtle))return s;const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("capy:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

/* ---------- GitHub sync ---------- */
const gurl=()=>`https://api.github.com/repos/${cfg.repo}/contents/data.json`;
const hd=()=>({Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const enc=s=>{const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+8000));return btoa(o)};
const dec=c=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\s/g,"")),x=>x.charCodeAt(0))));
function setSt(t){$("st").textContent=t}
async function pull(){try{const r=await fetch(gurl(),{headers:hd(),cache:"no-store"});
  if(r.status==404){sha=null;return "none"}
  if(!r.ok)return r.status==401||r.status==403?"auth":"err";
  const j=await r.json();sha=j.sha;S=norm(dec(j.content));return "ok"}catch(e){return "err"}}
async function push(){try{const b={message:"Update "+new Date().toISOString(),content:enc(JSON.stringify(S))};if(sha)b.sha=sha;
  const r=await fetch(gurl(),{method:"PUT",headers:hd(),body:JSON.stringify(b)});
  if(r.ok){const j=await r.json();sha=j.content.sha;return 200}return r.status}catch(e){return 0}}
function stText(r){setSt(r==200||r=="ok"?"☁️ Synced "+new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}):r=="auth"||r==401||r==403?"⚠️ Token problem – check sync settings":r=="none"?"☁️ New data file will be created":"⚠️ Offline – changes saved on this device")}
function mutate(fn){
  fn(S);cache();render();
  if(!cfg){setSt("📴 Not synced – this device only");return}
  q=q.then(async()=>{
    const p=await pull();
    if(p=="ok"){fn(S)}
    else if(p!="none"){cache();render();stText(p);return}
    let r=await push();
    if(r==409||r==422){const p2=await pull();if(p2=="ok")fn(S);r=await push()}
    cache();render();stText(r)});
}
function refresh(){
  if(!cfg){setSt("📴 Not synced – this device only");return}
  q=q.then(async()=>{const before=JSON.stringify(S),p=await pull();
    if(p=="ok"){cache();if(JSON.stringify(S)!=before)render()}stText(p=="ok"?200:p)});
}
setInterval(()=>{if(!document.hidden)refresh()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});

/* ---------- mascots ---------- */
function turtle(h){$("capy").innerHTML=`<ellipse cx="30" cy="88" rx="9" ry="7" fill="#7dbb6e"/><ellipse cx="72" cy="88" rx="9" ry="7" fill="#7dbb6e"/><path d="M16 66q-8 2-10 8q8 0 12-4z" fill="#7dbb6e"/>
  <ellipse cx="52" cy="62" rx="38" ry="28" fill="#f5c84b"/><path d="M52 36v52M24 52q28 10 56 0M24 74q28-10 56 0" stroke="#d99a1f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="96" cy="58" r="15" fill="#8fcf7e"/>${h?'<path d="M96 52q4-6 8 0" stroke="#3d4a2f" stroke-width="2.5" fill="none" stroke-linecap="round"/>':'<circle cx="101" cy="54" r="3" fill="#3d4a2f"/>'}<circle cx="91" cy="64" r="4" fill="#f6a5a5" opacity=".7"/><path d="M99 63q4 4 8 0" stroke="#3d4a2f" stroke-width="2" fill="none" stroke-linecap="round"/>`}
function capy(h){if(cur=="Henry"){turtle(h);return}
  $("capy").innerHTML=`<ellipse cx="55" cy="68" rx="42" ry="26" fill="#b98a5e"/><rect x="26" y="84" width="10" height="12" rx="4" fill="#a37549"/><rect x="62" y="84" width="10" height="12" rx="4" fill="#a37549"/>
  <ellipse cx="86" cy="50" rx="25" ry="20" fill="#c19466"/><circle cx="72" cy="33" r="5" fill="#a37549"/><circle cx="97" cy="33" r="5" fill="#a37549"/>
  <ellipse cx="102" cy="58" rx="13" ry="9" fill="#a37549"/><ellipse cx="108" cy="54" rx="3.5" ry="2.5" fill="#4a3426"/>
  ${h?'<path d="M80 47q4-6 8 0" stroke="#4a3426" stroke-width="2.5" fill="none" stroke-linecap="round"/>':'<circle cx="84" cy="47" r="3" fill="#4a3426"/>'}
  <circle cx="76" cy="56" r="5" fill="#f6a5a5" opacity=".7"/><circle cx="84" cy="24" r="8" fill="#ffb347"/><path d="M84 17q3-5 6-3" stroke="#6aa86a" stroke-width="2.5" fill="none"/>`}

/* ---------- render ---------- */
function render(){
  $("date").value=date;document.documentElement.style.setProperty("--acc",cur=="Henry"?"#f0b92e":"#f3a7b8");
  ["addbox","annform"].forEach(i=>$(i).classList.toggle("hide",!parent));
  $("lock").textContent=parent?"🔓 Lock":"🔒 Parent";
  $("tabs").innerHTML=KIDS.map(k=>{const t=tasks(date,k);return `<button class="tab ${k==cur?"on":""}" data-k="${k}" onclick="cur='${k}';render()">${k}${t.length?` ${t.filter(x=>x.done).length}/${t.length}`:""}</button>`}).join("");
  const t=tasks(date,cur),tm=t.reduce((a,x)=>a+x.min,0),dm=t.filter(x=>x.done).reduce((a,x)=>a+x.min,0),pct=tm?Math.round(dm/tm*100):0,all=t.length&&t.every(x=>x.done);
  $("summary").innerHTML=`<div class="row"><b style="font-weight:400;font-size:18px">${cur}’s day</b><span class="mu" style="margin-left:auto">${dm} / ${tm} min</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="mu">${all?"🌟 All finished! Amazing!":t.length?pct+"% done":"No homework today 🎈"}</div>`;
  $("say").textContent=all?`${cur} did it! ${cur=="Henry"?"Turtle":"Capy"} is so proud 🎉`:t.length?`${cur}, ${t.filter(x=>!x.done).length} to go. You can do it!`:"Relax and play!";
  capy(all);
  $("list").innerHTML=t.map(x=>`<div class="task ${x.done?"done":""}"><div class="info"><b>${esc(x.subj)}</b><span class="mu">${x.min} min</span></div>
    <button class="fin" onclick="fin('${x.id}')">${x.done?"✓ Finished":"Finish"}</button>${parent?`<button class="x" onclick="del('${x.id}')">✕</button>`:""}</div>`).join("");
  const subs=[...new Set(Object.values(S.data).flatMap(d=>KIDS.flatMap(k=>(d[k]||[]).map(x=>x.subj))))].slice(0,10);
  $("chips").innerHTML=subs.map((s,i)=>`<span class="chip" data-s="${i}">${esc(s)}</span>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("subj").value=subs[c.dataset.s]});
  anns_();charts();
}
function fin(id){const x=tasks(date,cur).find(y=>y.id==id);if(!x||(x.done&&!parent))return;const w=!x.done,d=date,k=cur;
  mutate(s=>{const t=((s.data[d]||{})[k]||[]).find(y=>y.id==id);if(t)t.done=w})}
function del(id){const d=date,k=cur;mutate(s=>{const l=(s.data[d]||{})[k];if(l)s.data[d][k]=l.filter(y=>y.id!=id)})}
function addTasks(d,map){mutate(s=>{for(const k in map){s.data[d]=s.data[d]||{};const l=s.data[d][k]=s.data[d][k]||[];map[k].forEach(o=>{if(!l.find(y=>y.id==o.id))l.push(o)})}})}

function anns_(){
  const td=iso(new Date()),l=S.anns.slice().sort((a,b)=>a.date.localeCompare(b.date)).filter(a=>a.date>=shift(-3,td));
  $("anns").innerHTML=l.length?l.map(a=>{const n=Math.round((new Date(a.date)-new Date(td))/864e5);
    const w=n==0?"Today":n==1?"Tomorrow":n>1?`In ${n} days`:"Past";
    const dt=new Date(a.date+"T12:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
    return `<div class="ann"><span class="ic">${a.icon}</span><div class="tt"><b>${esc(a.title)}</b> <span class="pill">${w}</span><div class="mu">${dt}${a.time?" · "+fmt(a.time):""}${a.note?"<br>"+esc(a.note):""}</div></div>${parent?`<button class="x" onclick="dela('${a.id}')">✕</button>`:""}</div>`}).join(""):'<div class="mu">Nothing coming up 🌿</div>';
}
function fmt(t){const[h,m]=t.split(":").map(Number);return `${h%12||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`}
function dela(id){mutate(s=>{s.anns=s.anns.filter(a=>a.id!=id)})}

function charts(){
  const days=[];for(let i=6;i>=0;i--)days.push(shift(-i));
  const m=(d,k)=>tasks(d,k).filter(x=>x.done).reduce((a,x)=>a+x.min,0);
  const mx=Math.max(30,...days.flatMap(d=>KIDS.map(k=>m(d,k))));
  let s=`<line x1="10" y1="120" x2="312" y2="120" stroke="var(--bd)" stroke-width="2"/>`;
  days.forEach((d,i)=>{const x=14+i*43;KIDS.forEach((k,j)=>{const v=m(d,k),h=v/mx*95;
    s+=`<rect x="${x+j*17}" y="${120-h}" width="15" height="${h}" rx="5" fill="${COL[k]}"/>${v?`<text x="${x+j*17+7.5}" y="${116-h}" font-size="9" text-anchor="middle">${v}</text>`:""}`});
    s+=`<text x="${x+16}" y="136" font-size="10" text-anchor="middle">${d.slice(5).replace("-","/")}</text>`});
  $("chart1").innerHTML=s;
  const wk={};let tot=0,dn=0;
  days.forEach(d=>tasks(d,cur).forEach(x=>{tot++;if(x.done){dn++;wk[x.subj]=(wk[x.subj]||0)+x.min}}));
  const e=Object.entries(wk).sort((a,b)=>b[1]-a[1]),mm=e.length?e[0][1]:1;
  $("ch2t").textContent=`🍡 ${cur}’s subjects this week`;
  $("chart2").innerHTML=e.length?e.map(([k,v])=>`<div class="sub"><span>${esc(k)}</span><div class="b"><i style="width:${v/mm*100}%;background:${COL[cur]}"></i></div><span>${v}m</span></div>`).join(""):'<div class="mu">No finished work yet</div>';
  $("rate").textContent=tot?`Completion rate: ${Math.round(dn/tot*100)}% (${dn} of ${tot} tasks)`:"";
}

/* ---------- PIN ---------- */
function askPin(mode){pinMode=mode;$("pint").textContent=mode=="unlock"?"Enter parent PIN":"Set a new PIN (4–8 digits)";$("pin").value="";$("perr").textContent="";$("pinm").classList.add("show");setTimeout(()=>$("pin").focus(),50)}
$("lock").onclick=()=>{if(parent){parent=false;render()}else askPin("unlock")};
$("chpin").onclick=()=>askPin("change");
$("pcancel").onclick=()=>$("pinm").classList.remove("show");
$("pok").onclick=async()=>{const v=$("pin").value.trim();
  if(pinMode=="unlock"){const ok=S.pin?(await H(v))===S.pin:v==="1234";
    if(ok){parent=true;$("pinm").classList.remove("show");render()}else $("perr").textContent="Wrong PIN, try again"}
  else if(/^\d{4,8}$/.test(v)){const h=await H(v);mutate(s=>{s.pin=h});$("pinm").classList.remove("show")}
  else $("perr").textContent="Use 4–8 digits"};
$("pin").onkeydown=e=>{if(e.key=="Enter")$("pok").click()};

/* ---------- sync settings ---------- */
$("sync").onclick=()=>{$("grepo").value=cfg?cfg.repo:GH_REPO;$("gtok").value="";$("gerr").textContent="";$("syncm").classList.add("show")};
$("gcancel").onclick=()=>$("syncm").classList.remove("show");
$("gdis").onclick=()=>{cfg=null;try{localStorage.removeItem("hwGH")}catch(e){}$("syncm").classList.remove("show");refresh()};
$("gsave").onclick=async()=>{const repo=$("grepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,""),tok=$("gtok").value.trim()||(cfg&&cfg.token);
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok){$("gerr").textContent="Enter owner/repo and a token";return}
  cfg={repo,token:tok};$("gerr").textContent="Testing…";const p=await pull();
  if(p=="auth"||p=="err"){$("gerr").textContent=p=="auth"?"Token rejected or no access to that repo":"Could not reach GitHub";return}
  sv("hwGH",cfg);
  if(p=="none"){const r=await push();if(r!=200){$("gerr").textContent="Could not create data.json (error "+r+")";return}}
  cache();render();stText(200);$("syncm").classList.remove("show")};

/* ---------- actions ---------- */
$("add").onclick=()=>{const s=$("subj").value.trim(),m=parseInt($("min").value)||0;if(!s)return;const map={};
  if($("fH").checked)map.Henry=[{id:uid(),subj:s,min:m,done:false}];
  if($("fA").checked)map.Hanna=[{id:uid(),subj:s,min:m,done:false}];
  $("subj").value="";addTasks(date,map)};
$("copy").onclick=()=>{const p=shift(-1),map={};KIDS.forEach(k=>{map[k]=tasks(p,k).map(x=>({id:uid(),subj:x.subj,min:x.min,done:false}))});addTasks(date,map)};
$("aadd").onclick=()=>{const t=$("atitle").value.trim(),d=$("adate").value;if(!t||!d)return;
  const a={id:uid(),icon:$("atype").value,title:t,date:d,time:$("atime").value,note:$("anote").value.trim()};
  ["atitle","anote","atime"].forEach(i=>$(i).value="");
  mutate(s=>{if(!s.anns.find(y=>y.id==a.id))s.anns.push(a)})};
$("prev").onclick=()=>{date=shift(-1);render()};$("next").onclick=()=>{date=shift(1);render()};
$("today").onclick=()=>{date=iso(new Date());render()};$("date").onchange=e=>{if(e.target.value){date=e.target.value;render()}};
render();refresh();
</script></body></html>
